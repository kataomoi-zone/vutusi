name: vutusi
options:
  bundleIdPrefix: com.kawarimidoll
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: 8QD5Y2QV2Q
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_VERSION: "6.0"
    # A local build's version; releases pass the tag (scripts/release.sh).
    MARKETING_VERSION: "0.0.0"
    CURRENT_PROJECT_VERSION: "1"
  configs:
    # Release builds sign with the Developer ID certificate and hand-made profiles
    # (README: Release), so they need no Xcode account or API key and build on CI.
    Release:
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: Developer ID Application
packages:
  VRMKit:
    url: https://github.com/tattn/VRMKit
    revision: 1afe8811370d05d50367a226bc069c3ab62fd8f2
targets:
  vutusi:
    type: application
    platform: macOS
    sources:
      - Sources/App
      - Sources/Shared
      # Built by scripts/build-web.sh; copied whole as the tracking page.
      - path: web
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kawarimidoll.vutusi
        INFOPLIST_FILE: Resources/App/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/App/vutusi.entitlements
      configs:
        Release:
          PROVISIONING_PROFILE_SPECIFIER: vutusi Developer ID
    dependencies:
      - target: VutusiCameraExtension
      - package: VRMKit
        product: VRMRealityKit
  VutusiCameraExtension:
    type: system-extension
    platform: macOS
    sources:
      - Sources/CameraExtension
      - Sources/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kawarimidoll.vutusi.CameraExtension
        # OSSystemExtensionRequest looks up Contents/Library/SystemExtensions/<bundle id>.systemextension.
        PRODUCT_NAME: $(PRODUCT_BUNDLE_IDENTIFIER)
        INFOPLIST_FILE: Resources/CameraExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/CameraExtension/CameraExtension.entitlements
        ENABLE_APP_SANDBOX: YES
        REGISTER_APP_GROUPS: YES
      configs:
        Release:
          PROVISIONING_PROFILE_SPECIFIER: vutusi Camera Extension Developer ID
