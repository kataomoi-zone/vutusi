# Build, sign, notarize, and publish a vutusi release. Manual trigger only: a
# dispatch cuts a date-based CalVer tag (YYYY.MMDD.N, as e05 does), builds from
# source in this public run, attests the zip's provenance, and publishes it as the
# release asset.
#
# Required repository secrets:
#   MACOS_CERT_P12_BASE64          Developer ID Application certificate with its
#                                  private key (.p12), base64. It must be the one
#                                  the two profiles below were made with.
#   MACOS_CERT_PASSWORD            Password of that .p12.
#   MACOS_APP_PROFILE_BASE64       "vutusi Developer ID" profile, base64.
#   MACOS_EXTENSION_PROFILE_BASE64 "vutusi Camera Extension Developer ID" profile, base64.
#   MACOS_NOTARY_KEY_P8_BASE64     App Store Connect API key (.p8), base64.
#   MACOS_NOTARY_KEY_ID            Its key ID.
#   MACOS_NOTARY_ISSUER            Its issuer ID.
name: release

on:
  workflow_dispatch:
    inputs:
      note:
        description: "Optional release note"
        type: string
        required: false

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    name: Build and publish release
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write # tag + release on this repo
      id-token: write # build-provenance attestation
      attestations: write # build-provenance attestation
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Compute CalVer version
        id: ver
        run: |
          set -euo pipefail
          DATE="$(date -u +%Y.%m%d)"
          LAST="$(git tag -l "${DATE}.*" | awk -F. '{print $NF}' | sort -n | tail -1)"
          VERSION="${DATE}.$(( ${LAST:-0} + 1 ))"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Release version: ${VERSION}"

      # The scripts fall back to nix for these, which the runner does not have.
      - name: Install build tools
        run: brew install xcodegen esbuild

      - name: Import signing certificate and profiles
        env:
          CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APP_PROFILE_BASE64: ${{ secrets.MACOS_APP_PROFILE_BASE64 }}
          EXTENSION_PROFILE_BASE64: ${{ secrets.MACOS_EXTENSION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PW="$(openssl rand -base64 24)"
          echo "$CERT_P12_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import "$CERT_PATH" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PW" "$KEYCHAIN" > /dev/null
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$CERT_PATH"
          # Where xcodebuild looks for profiles; older Xcode reads the MobileDevice one.
          for dir in "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" "$HOME/Library/MobileDevice/Provisioning Profiles"; do
            mkdir -p "$dir"
            echo "$APP_PROFILE_BASE64" | base64 --decode > "$dir/vutusi.provisionprofile"
            echo "$EXTENSION_PROFILE_BASE64" | base64 --decode > "$dir/vutusi-camera-extension.provisionprofile"
          done

      - name: Build, sign, notarize
        id: build
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          VUTUSI_ASC_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          VUTUSI_ASC_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER }}
          NOTARY_KEY_P8_BASE64: ${{ secrets.MACOS_NOTARY_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          export VUTUSI_ASC_KEY_PATH="$RUNNER_TEMP/notary.p8"
          echo "$NOTARY_KEY_P8_BASE64" | base64 --decode > "$VUTUSI_ASC_KEY_PATH"
          ./scripts/release.sh
          ./scripts/notarize.sh | tee "$RUNNER_TEMP/notarize.log"
          rm -f "$VUTUSI_ASC_KEY_PATH"
          ZIP="$GITHUB_WORKSPACE/$(tail -1 "$RUNNER_TEMP/notarize.log" | sed 's/^notarize.sh: //')"
          test -f "$ZIP"
          echo "zip=${ZIP}" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.build.outputs.zip }}

      # The tag is created with the release, after everything above succeeded, so a
      # failed run leaves no tag behind.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
          ZIP: ${{ steps.build.outputs.zip }}
          NOTE: ${{ inputs.note }}
        run: |
          set -euo pipefail
          gh release create "$VERSION" "$ZIP" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --notes "${NOTE:-Automated release.}"
